<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>HW4 — Tech Conference Registration Portal</title>
  <link rel="stylesheet" href="css/hw4.css">
</head>

<body>
  <header>
    <h1>FutureWeb 2026</h1>
    <p>For all your futuristic web needs!</p>
  </header>
  <main class="container">
    <div class="event-info">
      <h2>Event Details</h2>
      <ul>
        <li><strong>Date:</strong> March 15-17, 2026</li>
        <li><strong>Location:</strong> St. Edward's University, Austin, TX</li>
        <li><strong>Keynote Speaker:</strong> Dr. John McCurry, Professor of Web Development</li>
      </ul>
      <img class="photo" src="images/future_web.png" alt="Flyer" width="400">
    </div>
    <div class="registration-form">
      <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
        <fieldset>
          <legend>Attendance Details</legend>
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="your.email@example.com" required>

          <label for="date">Date of Arrival</label>
          <input type="date" id="date" name="date" placeholder="MM/DD/YYYY" required>
        </fieldset>
        <fieldset>
          <legend>Session Preferences</legend>
          <select name="Track Selection" id="selection" placeholder="Select a track" required>
            <optgroup label="Frontend">
              <option value="react">React</option>
              <option value="vue">Vue</option>
            </optgroup>
            <optgroup label="Backend">
              <option value="data">Database</option>
              <option value="security">Security and Authentication</option>
            </optgroup>
          </select>
          <label for="resume">Upload Resume</label>
          <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
        </fieldset>
        <button type="submit">Submit</button>
    </div>
  </main>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW6 - Interactive Product Calculator</title>
    <link rel="stylesheet" href="css/hw6.css">
    <script defer src="js/hw6-script.js"></script>
</head>

<body>
    <header class="site-header">
        <h1>Product Order Calculator</h1>
    </header>
    <main class="container">
        <form id="orderForm">
            <fieldset>
                <legend>Order Details</legend>
                <div class="form-group">
                    <label for="product">Product</label>
                    <select id="product" name="product">
                        <option value="" disabled selected>Select a product</option>
                        <option value="laptop">Laptop</option>
                        <option value="tablet">Tablet</option>
                        <option value="phone">Phone</option>
                        <option value="monitor">Monitor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
                </div>
                <div class="form-group">
                    <label for="discountCode">Discount Code</label>
                    <input type="text" id="discountCode" name="discountCode" placeholder="Try: SAVE10"
                        autocomplete="off">
                </div>
            </fieldset>

            <button type="submit" id="submit-btn">Calculate Total</button>
        </form>

        <div id="results" class="results-hidden">
            <div id="order-summary">
                <h2>Order Summary</h2>
                <p id="res-product">No product selected</p>
                <p id="res-quantity">Quantity: 0</p>
                <p id="res-subtotal">Subtotal: $0</p>
                <p id="res-discount">Discount: -$0</p>
                <p id="res-tax">Tax: $0</p>
                <p id="res-total">Total: $0</p>
            </div>
        </div>
    </main>
    <footer class="site-footer">Sofia Garcia - COSC 2328 - Professor McCurry | HW6</footer>
    <noscript>
        <div class="alert">Enable JavaScript to view interactive content.</div>
    </noscript>
</body>

</html>
